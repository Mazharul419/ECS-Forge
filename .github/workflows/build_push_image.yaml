name: CI - Build and Scan Docker image (Automatic)

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: ecs-forge-global-ecr

permissions:
  id-token: write
  contents: read

jobs:
  
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.vars.outputs.sha }}
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set variables
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t ${IMAGE_URI} .
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
      
      - name: Scan image with Grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.build.outputs.image_uri }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      
      - name: Generate HTML report with Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          git clone https://github.com/anchore/grype.git ~/.grype
          grype -o template -t ~/.grype/templates/html.tmpl ${IMAGE_URI} > report.html

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-report
          path: report.html

      - name: Login to ECR (refresh token)
        id: login-ecr-push
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          docker push ${IMAGE_URI}
          echo "Pushed: ${IMAGE_URI}"
